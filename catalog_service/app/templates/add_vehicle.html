{% extends "base.html" %}

{% block title %}Add Vehicle · Car Store{% endblock %}

{% block content %}
<section class="page-intro">
  <h1>Add a Vehicle to Inventory</h1>
  <p class="subtitle">Requires a valid authentication token from Auth Service.</p>
</section>

<form id="add-vehicle-form" class="form">
  <div class="form__group">
    <label for="token">Auth Token (Bearer)</label>
    <input type="text" id="token" name="token" placeholder="paste JWT from /login" required>
    <small class="meta">Visit <a href="/login">/login</a> first to obtain a token.</small>
  </div>

  <div class="form__row">
    <div class="form__group">
      <label for="brand">Brand</label>
      <input type="text" id="brand" name="brand" required maxlength="50">
    </div>
    <div class="form__group">
      <label for="model">Model</label>
      <input type="text" id="model" name="model" required maxlength="50">
    </div>
  </div>

  <div class="form__row">
    <div class="form__group">
      <label for="year">Year</label>
      <input type="number" id="year" name="year" required min="1990" max="2027">
    </div>
    <div class="form__group">
      <label for="mileage">Mileage (km)</label>
      <input type="number" id="mileage" name="mileage" required min="0">
    </div>
  </div>

  <div class="form__row">
    <div class="form__group">
      <label for="price">Price (€)</label>
      <input type="number" id="price" name="price" required min="0" step="0.01">
    </div>
    <div class="form__group">
      <label for="fuel_type">Fuel Type</label>
      <select id="fuel_type" name="fuel_type" required>
        <option value="gasoline">Gasoline</option>
        <option value="diesel">Diesel</option>
        <option value="electric">Electric</option>
        <option value="hybrid">Hybrid</option>
      </select>
    </div>
  </div>

  <div class="form__group">
    <label for="description">Description (Optional)</label>
    <textarea id="description" name="description" placeholder="Describe the vehicle's condition, features, history..." rows="3" maxlength="500"></textarea>
  </div>

  <button type="submit" class="btn btn--primary">Add Vehicle</button>
  <div id="result" class="form__result"></div>
</form>

<script>
document.getElementById('add-vehicle-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const token = form.token.value;
  const resultDiv = document.getElementById('result');

  const payload = {
    brand: form.brand.value,
    model: form.model.value,
    year: parseInt(form.year.value),
    mileage: parseInt(form.mileage.value),
    price: parseFloat(form.price.value),
    fuel_type: form.fuel_type.value,
    description: form.description.value.trim() || null
  };

  try {
    const resp = await fetch('/api/vehicles', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify(payload)
    });
    const data = await resp.json();
    if (resp.ok) {
      resultDiv.className = 'form__result form__result--success';
      resultDiv.innerHTML = `✓ Vehicle added with ID #${data.id}. <a href="/vehicles/${data.id}">View →</a>`;
      form.reset();
      form.token.value = token; // keep token for next add
    } else {
      resultDiv.className = 'form__result form__result--error';
      resultDiv.textContent = `✗ ${data.detail || 'Failed to add vehicle'}`;
    }
  } catch (err) {
    resultDiv.className = 'form__result form__result--error';
    resultDiv.textContent = `✗ Network error: ${err.message}`;
  }
});
</script>
{% endblock %}
