{% extends "base.html" %}

{% block title %}Login · Car Store{% endblock %}

{% block content %}
<section class="page-intro">
  <h1>Sign in</h1>
  <p class="subtitle">Use your account, or register a new one below.</p>
</section>

<div class="auth-grid">
  <form id="login-form" class="form">
    <h2>Login</h2>
    <div class="form__group">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" required>
    </div>
    <div class="form__group">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" required minlength="8">
    </div>
    <button type="submit" class="btn btn--primary">Sign in</button>
  </form>

  <form id="register-form" class="form">
    <h2>Register</h2>
    <div class="form__group">
      <label for="reg-email">Email</label>
      <input type="email" id="reg-email" required>
    </div>
    <div class="form__group">
      <label for="reg-password">Password (min 8 chars)</label>
      <input type="password" id="reg-password" required minlength="8">
    </div>
    <button type="submit" class="btn">Create account</button>
  </form>
</div>

<div id="result" class="form__result"></div>

<script>
// Auth Service base URL.
// When accessed via browser, "auth_service" is not resolvable - we need a public URL.
// Use http://localhost:8001 since both services expose ports on the host.
const AUTH_URL = 'http://localhost:8001';

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const resultDiv = document.getElementById('result');
  try {
    const resp = await fetch(`${AUTH_URL}/login`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        email: document.getElementById('login-email').value,
        password: document.getElementById('login-password').value
      })
    });
    const data = await resp.json();
    if (resp.ok) {
      resultDiv.className = 'form__result form__result--success';
      resultDiv.innerHTML = `
        <p>✓ Logged in as <strong>${data.user.email}</strong></p>
        <p>Your token (copy it for the Add Vehicle form):</p>
        <textarea readonly onclick="this.select()" rows="4" style="width:100%;font-family:monospace;font-size:11px;">${data.access_token}</textarea>
        <p class="meta"><a href="/admin/add-vehicle">→ Go to Add Vehicle</a></p>
      `;
    } else {
      resultDiv.className = 'form__result form__result--error';
      resultDiv.textContent = `✗ ${data.detail || 'Login failed'}`;
    }
  } catch (err) {
    resultDiv.className = 'form__result form__result--error';
    resultDiv.textContent = `✗ Network error: ${err.message}`;
  }
});

document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const resultDiv = document.getElementById('result');
  try {
    const resp = await fetch(`${AUTH_URL}/register`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        email: document.getElementById('reg-email').value,
        password: document.getElementById('reg-password').value
      })
    });
    const data = await resp.json();
    if (resp.ok) {
      resultDiv.className = 'form__result form__result--success';
      resultDiv.innerHTML = `✓ Account created for <strong>${data.email}</strong>. Now sign in above.`;
    } else {
      resultDiv.className = 'form__result form__result--error';
      resultDiv.textContent = `✗ ${data.detail || 'Registration failed'}`;
    }
  } catch (err) {
    resultDiv.className = 'form__result form__result--error';
    resultDiv.textContent = `✗ Network error: ${err.message}`;
  }
});
</script>
{% endblock %}
