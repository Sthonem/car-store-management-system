stages:
  - test
  - build

build_job:
  stage: build
  image: docker:29.4.0
  services:
    - docker:dind
  script:
    - docker build -t fastapi-app-image .

test:
  stage: test
  image: python:3.12
  before_script:
    - pip install -r requirements.txt
  script:
    - pytest --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
