stages:
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

cache:
  paths:
    - .pip-cache/

test:auth_service:
  stage: test
  image: python:3.11-slim
  script:
    - cd auth_service
    - pip install -r requirements.txt
    - pytest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

test:catalog_service:
  stage: test
  image: python:3.11-slim
  script:
    - cd catalog_service
    - pip install -r requirements.txt
    - pytest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

build:images:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker build -t carstore-auth ./auth_service
    - docker build -t carstore-catalog ./catalog_service

