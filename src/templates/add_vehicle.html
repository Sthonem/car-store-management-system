{% extends "base.html" %}

{% block title %}Add Vehicle - Car Store Management{% endblock %}

{% block content %}
<section class="panel form-panel">
    <h1>Add Vehicle</h1>
    <form method="post" action="/vehicles/add">
        <label for="make">Make</label>
        <input id="make" name="make" type="text" placeholder="Toyota" required>

        <label for="model">Model</label>
        <input id="model" name="model" type="text" placeholder="Corolla" required>

        <label for="year">Year</label>
        <input id="year" name="year" type="number" min="1900" max="2100" required>

        <label for="price">Price</label>
        <input id="price" name="price" type="number" min="0" step="0.01" required>

        <label for="color">Color</label>
        <input id="color" name="color" type="text" placeholder="Silver">

        <label for="mileage">Mileage</label>
        <input id="mileage" name="mileage" type="number" min="0" value="0">

        <label for="description">Description</label>
        <textarea id="description" name="description" rows="4" placeholder="Short vehicle notes"></textarea>

        <button class="button" type="submit">Save Vehicle</button>
    </form>
</section>
{% endblock %}
